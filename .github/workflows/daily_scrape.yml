name: FPL Data Scrape

on:
  schedule:
    # Backup only. GitHub runs scheduled jobs late or drops them (we saw ~4 runs
    # a day against 24 asked for), so the real hourly trigger is Supabase pg_cron
    # calling workflow_dispatch (supabase/migrations/006_scheduled_triggers.sql).
    - cron: '23 */3 * * *'
  workflow_dispatch:  # Supabase scheduler, admin Sync button, manual runs

# Never run two scrapes at once; a second trigger waits for the first.
concurrency:
  group: fpl-data-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPE_SOURCE: github-actions
        run: python scrape_supabase.py

      - name: Upload raw JSON as artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot-${{ github.run_id }}
          path: |
            data/daily_snapshots/
            data/daily_fixtures/
          retention-days: 90
