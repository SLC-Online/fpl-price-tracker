name: Daily FPL Data Scrape

on:
  schedule:
    # Run at 01:00 UTC (02:00 BST) - before price changes typically happen at ~02:30 BST
    - cron: '0 1 * * *'
    # Also run at 03:00 UTC (04:00 BST) - to capture the state AFTER price changes
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python daily_scrape.py

      - name: Upload raw JSON as artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot-${{ github.run_id }}
          path: |
            data/daily_snapshots/
            data/daily_fixtures/
          retention-days: 90

      - name: Commit and push data
        run: |
          git config user.name "FPL Scraper Bot"
          git config user.email "scraper@github-actions"
          # Only commit the SQLite DB (raw JSON is in artifacts)
          git add data/price_tracker.db
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            DATE=$(date -u +%Y-%m-%d_%H%M)
            git commit -m "data: daily scrape ${DATE}"
            git push
          fi
