name: FPL Data Scrape

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper (Supabase)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SCRAPE_SOURCE: github-actions
        run: python scrape_supabase.py

      - name: Upload raw JSON as artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: fpl-snapshot-${{ github.run_id }}
          path: |
            data/daily_snapshots/
            data/daily_fixtures/
          retention-days: 90
