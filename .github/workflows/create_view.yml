name: Create final_projections view

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Create view via psql
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Extract project ref from URL
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed 's|https://||' | sed 's|\.supabase\.co||')
          
          # Install psql
          sudo apt-get install -y postgresql-client > /dev/null 2>&1
          
          # Connect and create view
          PGPASSWORD="$SUPABASE_SERVICE_KEY" psql \
            "postgresql://postgres.${PROJECT_REF}:${SUPABASE_SERVICE_KEY}@aws-0-eu-west-2.pooler.supabase.com:6543/postgres" \
            -c "
              CREATE OR REPLACE VIEW final_projections AS
              SELECT
                  pi.element_id,
                  pi.gameweek,
                  pi.expected_points,
                  pi.uploaded_for_gw,
                  pi.season,
                  pi.meta
              FROM projection_inputs pi
              JOIN projection_sources ps ON ps.id = pi.source_id
              WHERE ps.source_name = 'transfer_algorithm';

              GRANT SELECT ON final_projections TO anon, authenticated;
            "
          echo "✓ View created successfully"
