name: Import Transfer Algorithm from Patreon

on:
  schedule:
    # Every 15 minutes — the check is one cheap API call (~10s)
    # Only downloads/imports when a newer post is detected
    # Cost: ~490 of 2000 free Actions minutes per month
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check for new CSV and import
        env:
          PATREON_SESSION: ${{ secrets.PATREON_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scrape_patreon.py
