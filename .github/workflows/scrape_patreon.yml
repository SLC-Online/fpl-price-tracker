name: Import Transfer Algorithm from Patreon

on:
  schedule:
    # Backup only. GitHub runs scheduled jobs late or drops them (we saw ~4 runs
    # a day against 96 asked for), so the real 15-minute trigger is Supabase
    # pg_cron calling workflow_dispatch (supabase/migrations/006_scheduled_triggers.sql).
    # Each check is one cheap API call; it only imports when the post has changed.
    - cron: '41 */2 * * *'
  workflow_dispatch:  # Manual trigger
    inputs:
      force_reimport:
        description: 'Re-import the latest post even if already imported (fixes/refreshes data)'
        type: boolean
        default: false

# Never run two imports at once; a second trigger waits for the first.
concurrency:
  group: patreon-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Check for new CSV and import
        env:
          PATREON_SESSION: ${{ secrets.PATREON_SESSION }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_REIMPORT: ${{ inputs.force_reimport }}
        run: python scrape_patreon.py
